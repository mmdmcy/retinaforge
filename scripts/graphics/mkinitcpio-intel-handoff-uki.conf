# Alternate mkinitcpio config for RetinaForge Intel eDP-handoff UKI builds.
# Do not replace /etc/mkinitcpio.conf — pass with mkinitcpio --config.
#
# - Load apple-gmux + nouveau in initramfs (DIS owns panel for link training)
# - Omit kms hook and i915 so i915 probes only after gmux-edp-handoff.sh
# - Pair with modprobe.blacklist=i915 on the UKI cmdline

MODULES=(apple-gmux nouveau)
BINARIES=()
FILES=(/etc/modprobe.d/retinaforge-nvidia-off.conf /etc/modprobe.d/retinaforge-apple-gmux-softdep.conf)

HOOKS=(base systemd autodetect microcode modconf block keyboard sd-vconsole filesystems fsck)
