# Pin compositors to Iris Pro. cardN numbering is not stable; this symlink
# is created by 61-retinaforge-intel-drm.rules.
KWIN_DRM_DEVICES=/dev/dri/intel-igpu
WLR_DRM_DEVICES=/dev/dri/intel-igpu
AQ_DRM_DEVICES=/dev/dri/intel-igpu
# Haswell + this eDP: KWin atomic pageflips time out. Legacy modeset.
KWIN_DRM_NO_AMS=1
KWIN_DRM_USE_MODIFIERS=0
KWIN_DRM_DISABLE_TRIPLE_BUFFERING=1
AQ_NO_ATOMIC=1
WLR_DRM_NO_ATOMIC=1
