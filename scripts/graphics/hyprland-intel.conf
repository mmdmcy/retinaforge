# Daily Hyprland on this CachyOS Intel-lid boot (hyprlang).
# Omarchy: do not use this file. dofile hyprland-retinaforge.lua from
# ~/.config/hypr/hyprland.lua instead (keep Omarchy's rice).
#
# 0.56 has no dwindle:pseudotile (preserve_split stays).

source = /usr/local/share/retinaforge/hyprland-retinaforge.conf

general {
	gaps_in = 4
	gaps_out = 8
	border_size = 2
	layout = dwindle
}

dwindle {
	preserve_split = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = sh -c 'command -v waybar >/dev/null && waybar -c /usr/local/share/retinaforge/waybar/config.json -s /usr/local/share/retinaforge/waybar/style.css'
exec-once = sh -c 'command -v mako >/dev/null && mako'
exec-once = sh -c 'command -v nm-applet >/dev/null && nm-applet --indicator'
exec-once = sh -c 'command -v retinaforge-mbp-panel >/dev/null && retinaforge-mbp-panel'

# Command (SUPER): Mac-like. SUPER+Shift+E exits to the greeter.
bind = SUPER, SPACE, exec, /usr/local/bin/retinaforge-hypr-run
bind = SUPER, RETURN, exec, /usr/local/bin/retinaforge-hypr-term
bind = SUPER, Q, killactive
bind = SUPER, W, killactive
bind = SUPER, F, fullscreen
bind = SUPER, D, exec, /usr/local/bin/retinaforge-hypr-files
bind = SUPER, B, exec, firefox
bind = SUPER SHIFT, E, exit
bind = SUPER SHIFT, 3, exec, grim
bind = SUPER SHIFT, 4, exec, sh -c 'grim -g "$(slurp)"'

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
