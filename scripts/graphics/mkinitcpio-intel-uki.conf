# Alternate mkinitcpio config for RetinaForge Intel UKI builds only.
# Do not replace /etc/mkinitcpio.conf — pass with mkinitcpio --config.
#
# apple-gmux + nouveau load in initramfs so force_igd can switch the mux.
# Omit kms and i915: Haswell DDI_A_4_LANES must be poked before i915's first
# probe, otherwise PORT_A is treated as 2-lane and 2880x1800 is CLOCK_HIGH.
# Pair with modprobe.blacklist=i915 on the UKI cmdline; the
# retinaforge-i915-ddi-4lanes.service unit then pokes MMIO and loads i915.

MODULES=(apple-gmux nouveau)
BINARIES=()
FILES=(/etc/modprobe.d/retinaforge-nvidia-off.conf /etc/modprobe.d/retinaforge-apple-gmux-intel.conf /etc/modprobe.d/retinaforge-apple-gmux-softdep.conf)

HOOKS=(base systemd autodetect microcode modconf block keyboard sd-vconsole filesystems fsck)
