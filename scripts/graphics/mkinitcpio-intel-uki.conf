# Alternate mkinitcpio config for RetinaForge Intel UKI builds only.
# Do not replace /etc/mkinitcpio.conf — pass with mkinitcpio --config.

MODULES=(apple-gmux nouveau i915)
BINARIES=()
FILES=(/etc/modprobe.d/retinaforge-nvidia-off.conf /etc/modprobe.d/retinaforge-apple-gmux-intel.conf /etc/modprobe.d/retinaforge-apple-gmux-softdep.conf)

HOOKS=(base systemd autodetect microcode kms modconf block keyboard sd-vconsole filesystems fsck)
