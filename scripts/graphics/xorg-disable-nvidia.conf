# Neutralize the packaged NVIDIA OutputClass on the Intel UKI desktop.
# /usr/share/X11/xorg.conf.d/10-nvidia-drm-outputclass.conf still loads;
# this later Identifier match tells Xorg to ignore that GPU.
Section "OutputClass"
    Identifier "nvidia"
    MatchDriver "nvidia-drm"
    Option "Ignore" "true"
EndSection
