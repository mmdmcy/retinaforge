Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "IntelGraphics"
    Driver "modesetting"
    BusID "PCI:0:2:0"
    Option "AccelMethod" "glamor"
    Option "kmsdev" "/dev/dri/card1"
EndSection

Section "Monitor"
    Identifier "eDP-1"
    Modeline "2880x1800" 337.75 2880 2928 2960 3040 1800 1803 1809 1852 +hsync -vsync
    Option "PreferredMode" "2880x1800"
EndSection

Section "Screen"
    Identifier "IntelScreen"
    Device "IntelGraphics"
    Monitor "eDP-1"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "2880x1800"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "IntelLayout"
    Screen "IntelScreen"
EndSection
