# Hardware pin for MacBookPro11,3 Hyprland (Iris Pro lid).
# CachyOS daily: sourced from hyprland-intel.conf (hyprlang; 0.56 still
# loads .conf). Omarchy 4.0 is Lua — dofile the twin .lua instead:
#
#   dofile("/usr/local/share/retinaforge/hyprland-retinaforge.lua")
#
# Hyprland 0.56 dropped input:touchpad:tap, misc:vfr, dwindle:pseudotile.
# Use tap-to-click. Verify as the seated user:
#   Hyprland --verify-config --config /usr/local/share/retinaforge/hyprland-intel.conf
#
# Do not point AQ_DRM_DEVICES at /dev/dri/by-path (colons). Do not add the
# GT 750M card here — HDMI/TB stay on that GPU as a separate experiment.

env = AQ_DRM_DEVICES,/dev/dri/intel-igpu
env = AQ_NO_ATOMIC,1
env = WLR_DRM_DEVICES,/dev/dri/intel-igpu
env = WLR_DRM_NO_ATOMIC,1
env = XCURSOR_SIZE,36
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

monitor = eDP-2,2880x1800@59.99,0x0,2
monitor = ,preferred,auto,2

# hid_apple swap_opt_cmd=0 makes Command = Super. Do not use xkb
# applealu_iso+mac here — that combo fights the hid map.
input {
	kb_layout = nl
	kb_model = pc105
	follow_mouse = 1
	touchpad {
		natural_scroll = true
		tap-to-click = true
		clickfinger_behavior = true
		disable_while_typing = true
	}
}

# Three-finger workspace swipe (Hyprland 0.51+).
gesture = 3, horizontal, workspace

misc {
	disable_hyprland_logo = true
	force_default_wallpaper = 0
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
}

decoration {
	rounding = 6
	blur {
		enabled = false
	}
}

animations {
	enabled = true
	animation = windows, 1, 2, default
	animation = fade, 1, 2, default
	animation = workspaces, 1, 2, default
}

# Apple F-row (fnmode=1): volume / brightness.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, /usr/local/bin/retinaforge-brightness +5%
bindel = , XF86MonBrightnessDown, exec, /usr/local/bin/retinaforge-brightness 5%-
