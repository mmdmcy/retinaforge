# Command (⌘) is Super (Hyprland SUPER / Mod4). Option (⌥) is Alt.
# This machine had swap_opt_cmd=1 (Command acted as Alt). 0 is the Linux
# default and matches macOS muscle memory for window manager binds.
# fnmode=1: brightness / volume keys work without holding Fn.
options hid_apple swap_opt_cmd=0 fnmode=1
